syntax = "proto3";

package contextual.v1;

// What the bidder reads for a page: Redis key contextual:<sha256(normalised
// URL)>, normalised as src/lib/url_key.ml does (DoubleVerify IQC rules 1-3).
// A few hundred bytes.
//
// The same message, under contextual:section:<sha256(prefix)>, is a top
// section's or a site's profile: the mean of its crawled pages' scores,
// from 5 pages on, with no keywords (sdks/go Sections).
message PageProfile {
  // IAB Content Taxonomy 3.1 (cattax 9) ids, highest score first, scores
  // calibrated to [0, 1]. At most 20. Every label's ancestors are in the
  // list too, with at least its score: a category matches when its own id
  // is here (sdks/go relies on it).
  repeated Label labels = 1;
  // At most 20, most salient first.
  repeated string keywords = 2;
  // When the page was fetched, Unix seconds.
  int64 fetched_at = 3;
  // Cascade depth the labels come from (the lab writes "rich").
  string preset = 4;
  // Pipeline version (Engine.version): taxonomy, lexicon, models,
  // calibration, thresholds and T4 model, hashed. For logs and audits.
  string version = 5;
  // The page's labelled blocks in document order, at most 64: what a slot's
  // own context is made of once the bid request says which blocks surround
  // it (ortb2Imp.ext.data.ctx, sdks/prebid). No text, only its SimHash.
  repeated Block blocks = 6;
  // The page's ad containers (the element id a GPID ends with) and where
  // each sits, in viewports from the top as the crawler estimated it: a
  // slot's surroundings when the bid request carries no ext.data.ctx.
  repeated AdSlot ad_slots = 7;
}

message AdSlot {
  // The container's element id, the part of a GPID after its last #.
  string id = 1;
  // The bottom of the block before it, in viewports from the top.
  float top = 2;
}

message Block {
  // 64-bit SimHash of the block's words (src/lib/refresh.ml): a block of the
  // rendered page is this one when at most 3 bits differ.
  fixed64 simhash = 1;
  // Main content; false for navigation, widgets, comments.
  bool main = 2;
  // Its best labels, each ancestor included with at least its score.
  repeated Label labels = 3;
  // Its middle, in viewports from the top, as the crawler estimated it.
  float top = 4;
}

message Label {
  // IAB Content Taxonomy 3.1 unique id.
  string id = 1;
  // In [0, 1].
  float score = 2;
}
