<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Byakugan</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1222"/>
      <stop offset="1" stop-color="#2A2F52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8B0F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B8B0F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#E6E2F6"/>
      <stop offset="1" stop-color="#C9C2E8"/>
    </radialGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D6EA"/>
      <stop offset="0.35" stop-color="#F6F5FC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="eye">
      <path d="M38 140 C72 96 150 80 220 112 C176 166 104 178 46 146 Z"/>
    </clipPath>
    <!-- veins hug the eye and taper away from it: thick roots, thin tips -->
    <g id="roots" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 104 C226 94 226 84 232 76"/>
      <path d="M224 116 C234 112 238 106 244 102"/>
      <path d="M220 126 C230 132 232 140 238 148"/>
      <path d="M206 140 C212 150 210 158 214 168"/>
      <path d="M196 94 C200 84 196 76 200 66"/>
      <path d="M42 132 C34 126 32 118 26 110"/>
      <path d="M40 144 C32 150 28 158 22 164"/>
      <path d="M56 118 C50 108 54 100 50 90"/>
      <path d="M62 156 C58 166 62 176 56 186"/>
    </g>
    <g id="veins" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 104 C226 94 226 84 232 76 C238 68 236 58 242 48"/>
      <path d="M232 76 C240 76 246 70 250 62"/>
      <path d="M224 116 C234 112 238 106 244 102 C248 100 250 94 252 88"/>
      <path d="M220 126 C230 132 232 140 238 148 C244 156 244 166 250 174"/>
      <path d="M238 148 C246 146 250 140 252 132"/>
      <path d="M206 140 C212 150 210 158 214 168 C218 178 214 188 220 198"/>
      <path d="M196 94 C200 84 196 76 200 66 C204 58 200 50 204 40"/>
      <path d="M42 132 C34 126 32 118 26 110 C20 104 20 94 14 88"/>
      <path d="M26 110 C18 112 12 108 6 112"/>
      <path d="M40 144 C32 150 28 158 22 164 C16 170 16 180 10 186"/>
      <path d="M56 118 C50 108 54 100 50 90 C46 82 50 74 46 64"/>
      <path d="M62 156 C58 166 62 176 56 186 C52 194 56 204 50 212"/>
    </g>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <circle cx="130" cy="128" r="112" fill="url(#glow)"/>

  <!-- veins: shadow, body, highlight, so they read as raised -->
  <g stroke="#070A14" opacity="0.85"><use href="#veins" stroke-width="7"/><use href="#roots" stroke-width="11"/></g>
  <g stroke="#9189C9"><use href="#veins" stroke-width="4"/><use href="#roots" stroke-width="7.5"/></g>
  <g stroke="#E0DBF7" opacity="0.85" transform="translate(-1 -1)"><use href="#veins" stroke-width="1.2"/><use href="#roots" stroke-width="2"/></g>

  <!-- under-eye line -->
  <path d="M84 172 C106 182 132 182 156 176" fill="none" stroke="#9189C9" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>

  <!-- the eye -->
  <path d="M38 140 C72 96 150 80 220 112 C176 166 104 178 46 146 Z" fill="url(#sclera)"/>
  <g clip-path="url(#eye)">
    <circle cx="132" cy="128" r="42" fill="url(#iris)"/>
    <g fill="none" stroke="#B7AFDA">
      <circle cx="132" cy="128" r="42" stroke-width="2.4"/>
      <circle cx="132" cy="128" r="31" stroke-width="1.4" opacity="0.7"/>
      <circle cx="132" cy="128" r="21" stroke-width="1.2" opacity="0.55"/>
    </g>
    <!-- faint pupil: an ad slot -->
    <rect x="122" y="121" width="20" height="13" rx="3" fill="#CFC8EC" stroke="#A79ED2" stroke-width="1.4" opacity="0.8"/>
    <!-- lid shadow across the top of the eye -->
    <path d="M38 140 C72 96 150 80 220 112 L220 98 L38 98 Z" fill="#6C66A0" opacity="0.28"/>
  </g>
  <circle cx="150" cy="111" r="5" fill="#FFFFFF" opacity="0.95"/>

  <!-- lids: heavy upper lash line with an outer flick, thin lower lid -->
  <path d="M34 144 C70 94 150 76 222 110 L234 104" fill="none" stroke="#05070E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 140 C72 96 150 80 220 112" fill="none" stroke="#05070E" stroke-width="7" stroke-linecap="round"/>
  <path d="M50 148 C104 176 170 166 214 120" fill="none" stroke="#2B2950" stroke-width="3" stroke-linecap="round"/>
  <!-- brow crease -->
  <path d="M60 104 C100 76 160 68 214 88" fill="none" stroke="#05070E" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
